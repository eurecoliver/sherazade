services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://backend:8000
      - NEXTAUTH_URL=http://159.69.9.230
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      # Chiave pubblica VAPID per notifiche push PWA (letta dal .env del server)
      # Generare con: python manage.py generate_vapid_keys (nel container backend)
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=sherazade.settings.local
    command: bash -c "chmod +x /app/entrypoint.sh && /app/entrypoint.sh"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    # porta 5432 NON esposta all'esterno — accessibile solo nella rete Docker interna
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sherazade}
      POSTGRES_USER: ${POSTGRES_USER:-sherazade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sherazade_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sherazade} -d ${POSTGRES_DB:-sherazade}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    # porte 9000/9001 NON esposte all'esterno — il backend accede a MinIO via rete Docker interna
    # se in futuro serve accesso pubblico diretto a MinIO (USE_S3=True + URL pubblici),
    # esporre solo 9000 e configurare firewall Hetzner di conseguenza
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
